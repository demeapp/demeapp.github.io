name: Android debug build test

on:
  push:
    branches: [android-ci-build-test]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Sync web assets (live mode)
        run: npm run sync
      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deme-android-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: deme-android-debug-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Node 22 (bridge check)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boot emulator, install and launch Deme, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -dns-server 8.8.8.8
          script: |
            adb shell ping -c 2 demeapp.github.io || true
            adb install -r app-debug.apk
            adb shell monkey -p io.github.demeapp.deme -c android.intent.category.LAUNCHER 1
            sleep 20
            adb exec-out screencap -p > deme-android-1.png
            adb shell am force-stop io.github.demeapp.deme
            adb shell monkey -p io.github.demeapp.deme -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > deme-android-2.png
            node native/scripts/bridge-check.mjs | tee bridge-check.log
            adb shell cmd package set-app-links-user-selection --package io.github.demeapp.deme --user 0 true demeapp.github.io || true
            adb shell pm set-app-links --package io.github.demeapp.deme 2 demeapp.github.io || true
            adb shell cmd package get-app-links io.github.demeapp.deme || true
            adb shell cmd package force-stop io.github.demeapp.deme
            adb shell cmd package query-intent-activities -a android.intent.action.VIEW -d https://demeapp.github.io/my-record.html || true
            adb shell am start -a android.intent.action.VIEW -d "https://demeapp.github.io/my-record.html" || true
            sleep 15
            adb exec-out screencap -p > deme-android-3.png
            adb shell dumpsys activity activities | grep -iE 'mResumedActivity|topResumedActivity' || true
            adb logcat -d | grep -iE 'ActivityTaskManager|cmp=io.github.demeapp.deme' || true
      - name: Upload Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: deme-android-screenshots
          path: |
            deme-android-*.png
            bridge-check.log
          if-no-files-found: error
