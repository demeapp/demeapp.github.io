name: iOS simulator build test

on:
  workflow_dispatch:
  push:
    branches:
      - ios-ci-build-test

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Icon alpha check (sips)
        run: sips -g hasAlpha native/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Install native dependencies
        working-directory: native
        run: npm ci

      - name: Sync web assets (live mode)
        working-directory: native
        run: npm run sync

      - name: Verify baked iOS config (safe-area guard)
        run: |
          cat native/ios/App/App/capacitor.config.json
          grep -q '"contentInset": "automatic"' native/ios/App/App/capacitor.config.json

      - name: List Xcode schemes
        working-directory: native
        run: xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build iOS app for simulator (unsigned)
        working-directory: native
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
          build

      - name: Simulator launch test
        working-directory: native
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$PWD/build/DerivedData" CODE_SIGNING_ALLOWED=NO build
          APP_PATH="$PWD/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          echo "App: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" io.github.demeapp.deme | tee sim-launch.log
          xcrun simctl io "$UDID" screenshot deme-sim-0-splash.png
          sleep 1
          xcrun simctl io "$UDID" screenshot deme-sim-1.png
          sleep 12
          xcrun simctl io "$UDID" screenshot deme-sim-2-light.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 3
          xcrun simctl io "$UDID" screenshot deme-sim-3-dark.png
          xcrun simctl spawn "$UDID" log show --style compact --last 3m --predicate 'process == "App"' > sim-log.txt 2>&1 || true
          xcrun simctl terminate "$UDID" io.github.demeapp.deme || true

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deme-ios-simulator-evidence
          path: |
            native/deme-sim-0-splash.png
            native/deme-sim-1.png
            native/deme-sim-2-light.png
            native/deme-sim-3-dark.png
            native/sim-launch.log
            native/sim-log.txt
          if-no-files-found: warn
