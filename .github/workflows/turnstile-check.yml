name: Turnstile sign-in check (CI)

on:
  push:
    branches: [ci-turnstile-check]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Sync web assets (live mode)
        run: npm run sync
      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deme-android-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  turnstile:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: deme-android-debug-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install Deme, run sign-in Turnstile check (default read-only mode)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -dns-server 8.8.8.8
          script: |
            adb install -r app-debug.apk
            adb shell monkey -p io.github.demeapp.deme -c android.intent.category.LAUNCHER 1
            sleep 20
            node native/scripts/signin-check.mjs 2>&1 | tee signin-check-api${{ matrix.api }}.log
            echo "SIGNIN_CHECK_EXIT=${PIPESTATUS[0]}" | tee -a signin-check-api${{ matrix.api }}.log
      - name: Upload sign-in check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signin-check-log-api${{ matrix.api }}
          path: signin-check-api${{ matrix.api }}.log
          if-no-files-found: warn
