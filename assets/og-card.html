<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deme — share card (1200×630)</title>
<link rel="icon" href="../favicon-navy-2026.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-2026.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&amp;family=Inter:wght@400;600;700&amp;display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "Inter", -apple-system, "Segoe UI", Arial, sans-serif;
    color: #E3F4EC;
    background:
      radial-gradient(900px 340px at 92% -10%, rgba(47,191,143,.16), transparent 60%),
      radial-gradient(640px 300px at -6% 0%, rgba(255,255,255,.08), transparent 55%),
      linear-gradient(115deg, transparent 46%, rgba(255,255,255,.05) 47%, transparent 49%),
      linear-gradient(72deg, transparent 62%, rgba(47,191,143,.07) 63%, transparent 65%),
      linear-gradient(158deg, transparent 30%, rgba(255,255,255,.04) 31.5%, transparent 33%),
      linear-gradient(120deg, #0E2A47, #0A1F38);
  }
  .card { display: flex; align-items: center; gap: 84px; height: 100%; padding: 72px 88px; }
  .mark { flex: none; }
  .kicker {
    font-size: 17px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: #76DBB6; margin-bottom: 22px;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 900;
    font-size: 118px; line-height: 1; letter-spacing: -.02em; margin-bottom: 18px;
  }
  .tagline {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: 37px; line-height: 1.2; margin-bottom: 26px;
  }
  .rule { width: 72px; height: 4px; background: #2FBF8F; border: 0; margin-bottom: 26px; }
  .line { font-size: 26px; line-height: 1.45; color: #E3F4EC; max-width: 600px; margin-bottom: 34px; }
  .stats {
    font-size: 19px; font-weight: 600; letter-spacing: .04em; color: #76DBB6;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" width="228" height="289" viewBox="0 0 30 38" aria-hidden="true">
      <rect x="3" y="2" width="24" height="4" rx="1" fill="#2FBF8F"/>
      <rect x="6" y="9" width="3.6" height="19" fill="#FFFFFF"/>
      <rect x="13.2" y="9" width="3.6" height="19" fill="#FFFFFF"/>
      <rect x="20.4" y="9" width="3.6" height="19" fill="#FFFFFF"/>
      <rect x="3" y="31" width="24" height="4" rx="1" fill="#2FBF8F"/>
    </svg>
    <div>
      <p class="kicker">Toronto City Council · The record, in plain language</p>
      <h1>Deme</h1>
      <p class="tagline">Where the people meet the vote</p>
      <hr class="rule">
      <p class="line">Toronto City Council's record, in plain language.</p>
      <p class="stats">33,796 decisions · 631,418 votes cast · totals back to 2006, rows from 2018</p>
    </div>
  </div>
</body>
</html>
