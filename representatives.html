<style>
/* Page-local directory styles: the Toronto directory's block,
   carried over unchanged when the three directories combined
   (nav-parity wave, Oct 28, 2026) — the Ontario and Canada
   directories shared this same block. */
/* Unified directory finder (Oct 20, 2026): one elevated Navy & Mint
   panel takes both the name search and the postal-code lookup. Page-
   local so the shared stylesheet stays untouched. */
.finder-panel {
  margin-top: 1.4rem; border-radius: 16px; position: relative;
  overflow: hidden; padding-top: 1.5rem;
  box-shadow: 0 10px 30px rgba(10, 31, 56, .10);
}
.finder-panel::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
  background: linear-gradient(90deg, var(--navy) 0%, var(--bronze) 100%);
}
.finder-panel h2 { font-size: 1.3rem; margin: 0 0 .4rem; color: var(--navy-ink); }
.finder-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .8rem; }
.finder-row input[type="text"] {
  flex: 1 1 14rem; min-width: 0; font-size: 1.05rem;
  padding: .75rem 1rem; border: 1.5px solid var(--line);
  border-radius: 12px; background: #fff; color: var(--ink);
}
.finder-row input[type="text"]:focus {
  outline: none; border-color: var(--bronze-dark);
  box-shadow: 0 0 0 3px var(--mint-light);
}
.finder-row .btn { border-radius: 12px; }
/* Earlier-members section search (polish wave): page-local, light. */
.earlier-search { margin: 1rem 0 .4rem; }
.earlier-search input[type="text"] {
  width: 100%; box-sizing: border-box; font-size: 1rem;
  padding: .65rem .9rem; border: 1.5px solid var(--line);
  border-radius: 12px; background: #fff; color: var(--ink);
}
.earlier-search input[type="text"]:focus {
  outline: none; border-color: var(--bronze-dark);
  box-shadow: 0 0 0 3px var(--mint-light);
}
.earlier-group { margin-top: 1.1rem; }
.earlier-group h4 { margin: 0 0 .35rem; font-size: 1rem; color: var(--navy-ink); }
.earlier-group h3 { margin: 0 0 .35rem; font-size: 1.08rem; color: var(--navy-ink); }
#earlier-details summary h2 { display: inline; font-size: 1.05rem; margin: 0; }
.earlier-note { max-width: 44rem; }
/* Earlier rows: a fixed text column beside the avatar (polish wave,
   visitor-eye fix). The shared .personlist row is space-between —
   written when rows held only a name and a term list. With ward
   history + participation added, desktop rows scattered the name to a
   different x on every row and a long record broke its row. Scoped
   to this section only; the shared rule is untouched. */
/* v18 (Oct 23, 2026): the row is an organized record unit — name,
   tenure line, ward history on its own line(s), then the summary
   stats as aligned labelled columns in the member cards'
   .member-stats language, so the eye can compare down the list.
   Every fact the old running line carried is still on the row. */
#earlier-details .personlist li { justify-content: flex-start; flex-wrap: nowrap; align-items: flex-start; }
#earlier-details .personlist li > .avatar { flex: none; }
.em-main { flex: 1 1 auto; min-width: 0; }
.em-name { margin: 0; font-size: 1.08rem; line-height: 1.3; }
.em-terms { margin: .2rem 0 0; color: var(--ink-soft); font-size: .92rem; }
.em-wards { margin: .15rem 0 0; color: var(--ink-faint); font-size: .875rem; }
.em-wards span { display: block; }
.em-stats {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: .55rem 1.25rem; margin-top: .65rem; max-width: 36rem;
}
.em-stats > div { min-width: 0; }
.em-stats span {
  display: block; color: var(--ink-faint); font-size: .72rem; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase;
}
.em-stats strong { display: block; margin-top: .15rem; font-size: 1.05rem; line-height: 1.25; color: var(--ink); }
/* Register-counts line (v30): the official registers are a SEPARATE
   record from the vote-flag stat above, so the line sits in its own
   mint band under the stats — never inside .em-stats, never wearing
   the vote-flag label. */
.em-register {
  margin: .65rem 0 0; max-width: 36rem; padding: .45rem .6rem;
  background: var(--mint-light); border-left: 3px solid var(--bronze-dark);
  font-size: .9rem; line-height: 1.45; color: var(--ink-soft);
}
.em-register-src { display: block; margin-top: .15rem; color: var(--ink-faint); font-size: .8rem; }
@media (max-width: 480px) {
  .em-stats { gap: .55rem .8rem; }
  .em-stats span { font-size: .66rem; }
  /* Fix D1 (visitor-eye, v30 fix round): the earlier rows' 3-across
     stats squeeze to ~74px per column at 390px and the middle label
     overflows into the third column. Scoped to #earlier-details —
     the only context .em-stats renders in — switch to two columns
     at narrow widths and let labels break cleanly rather than
     overflow. Desktop layout, current-member cards and the
     .em-register band are untouched. */
  #earlier-details .em-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #earlier-details .em-stats span { overflow-wrap: break-word; }
}
/* Incoming-member card block (v32; structured in the
   search-federation wave, Oct 28, 2026): replaces the four-stat
   block on the seven cards for members elected Oct 26, 2026 whose
   record has not begun — marker, record line, portrait line. Navy &
   Mint system colours only. */
.incoming-block { padding: 1.1rem 1.45rem 1.35rem; }
.incoming-block p { margin: 0 0 .45rem; font-size: .86rem; line-height: 1.45; }
.incoming-block p:last-child { margin-bottom: 0; }
.incoming-marker { color: var(--navy); }
.incoming-record { color: var(--ink); }
.incoming-portrait { color: var(--ink-faint); font-size: .8rem; }

/* The directory's own level switch: the same segmented control as
   the header switcher (44px targets, short labels on small screens,
   the body named in full from 720px up), sitting with the directory
   it switches. The current level is the filled navy segment. */
.rep-switch-row { margin: 1.2rem 0 .2rem; }
.chooser-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-top:1.2rem; }
.chooser-card { display:flex; flex-direction:column; gap:.35rem; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1.2rem 1.3rem; text-decoration:none; color:var(--ink); box-shadow:var(--shadow-sm); }
.chooser-card:hover { border-color:var(--navy); }
.chooser-k { font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--bronze-dark); font-weight:700; }
.chooser-t { font-size:1.3rem; font-weight:700; color:var(--navy); line-height:1.25; }
.chooser-d { color:var(--ink-soft); font-size:.95rem; }
.chooser-go { margin-top:auto; font-weight:700; color:var(--navy); }
@media (max-width:720px){ .chooser-grid{ grid-template-columns:1fr; } }
.rep-switch-row .level-switcher { margin-top: 0; }
</style>

      <div class="coverage-note">
        <strong>Coverage.</strong> This layer is the archive as gathered
        on October 20, 2026, and extended on October 27, 2026. Recorded
        votes: 505 divisions, July 19, 2018 – June 2, 2026 (the most
        recent sitting in this archive). The Assembly publishes
        searchable name-by-name votes only from the 43rd Parliament
        (2022) on. The 2018–2022 divisions were extracted from the
        Assembly's published House documents (Votes and Proceedings
        and Hansard): the extraction method was checked against the
        official searchable record for the 43rd Parliament, where it
        recovered 194 of its 204 divisions. On that basis the
        2018–2022 span is expected to be nearly complete, but it may
        still miss a small number of divisions, and it is an
        extraction, not the Assembly's official searchable record.
        Where the House document does not name the bill behind a
        division, the division carries no bill link. Disclosure
        statements: the complete series, 2005–2025.
        Expenses: payments from April 2024 to December 2025, plus
        annual totals back to 2015–16 — some early annual figures rest
        on scanned documents, and ministers' expenses are published in
        a separate provincial system and are not included. Lobbying:
        Ontario publishes lobbyist registrations — statements of intent
        to lobby — not records of contacts or meetings; each current
        member's page shows the registration picture for their office,
        labelled as such.

<script>
/* Combined Representatives directory (nav-parity wave, Oct 28, 2026):
   one directory for all three legislatures. The level comes from
   ?level= (toronto | ontario | canada; Toronto is the default), each
   level's directory body is the <template> above — the same body its
   own page carried — and the level's own renderer runs underneath,
   so profiles, finders and coverage notes behave exactly as they
   did on the three separate pages. The page title, kicker and H1
   take the level's own wording, and window.__demeLayer is set
   before the renderer calls renderChrome, so the header switcher
   and the layer-aware footer speak for the level on show. */
(function () {
  var LEVELS = {
    toronto: { layer: "toronto", title: "Representatives — Deme",
      kicker: "Representatives", h1: "The people on the record" },
    ontario: { layer: "ontario",
      title: "Members of Provincial Parliament — Deme",
      kicker: "Representatives — Ontario",
      h1: "Members of Provincial Parliament" },
    canada: { layer: "canada", title: "Members of Parliament — Deme",
      kicker: "Representatives — Canada",
      h1: "Members of Parliament" }
  };
  var key = (new URLSearchParams(location.search).get("level")
    || "").toLowerCase();
  if (!LEVELS[key]) {
    // No level chosen: show the chooser rather than presuming a level.
    window.__demeLayer = "site";
    document.getElementById("level-root")
      .appendChild(document.getElementById("tpl-chooser")
        .content.cloneNode(true));
    // No level renderer loads in this state, so render the chrome here.
    renderChrome("representatives.html");
    return;
  }
  var cfg = LEVELS[key];
  window.__demeLayer = cfg.layer;
  document.title = cfg.title;
  document.getElementById("rep-kicker").textContent = cfg.kicker;
  document.getElementById("people-h").textContent = cfg.h1;
  document.querySelectorAll(".rep-switch-row [data-level]")
    .forEach(function (a) {
      if (a.getAttribute("data-level") === key)
        a.setAttribute("aria-current", "true");
    });
  if (key === "ontario") {
    window.DEME_LAYER_PAGE = {
      layer: "ontario", directoryPage: "representatives.html",
      dataDir: "record-data/ontario/", profilePage: "mpp.html",
      idParam: "m",
      photoDir: "assets/headshots/ontario/",
      roleNoun: "Member of Provincial Parliament",
      roleLine: (p) => `MPP · ${p.riding}`,
      tenureCurrent: (p) => `Since ${p.firstYear}`,
      interestsLabel: "Disclosure statements on file (annual statements, 2005–present)",
      interestsValue: (p) => p.pdsStatements
    };
  }
  if (key === "canada") {
    window.DEME_LAYER_PAGE = {
      layer: "canada", directoryPage: "representatives.html",
      dataDir: "record-data/federal/", profilePage: "mp.html",
      idParam: "m",
      photoDir: "assets/headshots/federal/",
      roleNoun: "Member of Parliament",
      roleLine: (p) => `MP · ${p.riding}${p.province ? `, ${p.province}` : ""}`,
      tenureCurrent: (p) => p.parliaments > 1
        ? `${p.parliaments} parliaments · since ${p.firstYear}`
        : `Since ${p.firstYear}`,
      interestsLabel: "Ethics registry documents on file",
      interestsValue: (p) => p.interestsDocuments
    };
  }
  var tpl = document.getElementById("tpl-" + key);
  document.getElementById("level-root")
    .appendChild(tpl.content.cloneNode(true));
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.body.appendChild(s);
    });
  }
  if (key === "toronto") {
    loadScript("assets/js/ward-finder.js")
      .then(function () {
        return loadScript("assets/js/toronto-directory.js");
      })
      .catch(function () { /* renderers surface their own load errors */ });
  } else {
    loadScript("assets/js/layer-directory.js")
      .catch(function () { /* renderers surface their own load errors */ });
  }
})();
</script>
<script data-goatcounter="https://demecivic.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
