<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weigh in — moved to My Record — Deme</title>
<meta name="description" content="Weighing in now lives in My Record: read what's coming up at Toronto City Council, sign in, and save your picks to your account.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/deme.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-navy-mint-v2.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-2026-v2.png">
<meta name="theme-color" content="#0E2A47">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>
  /* The weigh-in experience lives in My Record now (owner decision,
     Oct 20, 2026). A #<ref> deep link is preserved as the pending
     weigh-in, so the visitor lands on the same item there. */
  (function () {
    var ref = (location.hash || "").slice(1);
    if (ref) {
      try {
        sessionStorage.setItem("deme.pendingWeighIn", decodeURIComponent(ref));
      } catch (e) {}
    }
    location.replace("my-record.html#weigh-in");
  })();
</script>
<meta http-equiv="refresh" content="0; url=my-record.html#weigh-in">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header"></header>
<main id="main">
  <div class="wrap">
    <section>
      <p class="kicker">Before the vote</p>
      <h1>Weighing in has moved</h1>
      <hr class="rule">
      <p class="lede">The weigh-in now lives in
      <a href="my-record.html#weigh-in">My Record</a> — one personal home
      for your picks, your ward and your voting card. If you aren't
      taken there automatically, follow the link.</p>
    </section>
  </div>
</main>
<footer class="site-footer"></footer>
<script src="assets/js/simple-mode.js"></script>
<script src="assets/js/common.js"></script>
<script>renderChrome("my-record.html");</script>
<script data-goatcounter="https://demecivic.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
